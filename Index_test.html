  <script>
    // ==========================================================
    // 全域設定
    // ==========================================================

    const LIFF_ID = "2011307172-d3esgseq";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwJYszBcuHQ-BkR5k9NyUJJ3W-1F78dK4XP_epIaFrwtnv9sosk13ZR_7-iFvFmUmfU/exec";
    const GAS_API_CHANNEL = "NEW屋_SOCCER_GAS_API";

    let lineIdToken = "";
    let userLineId = "";
    let userBindings = [];
    let currentTab = "leave";
    let liffInitialized = false;
    let tokenRefreshing = null;
    const pendingApiRequests = new Map();

    // ==========================================================
    // 取得目前有效的 LINE ID Token
    // ==========================================================

    async function getCurrentLineIdToken() {
      if (typeof liff === "undefined") {
        throw new Error("LIFF SDK 尚未載入。");
      }

      if (!liffInitialized) {
        await liff.init({
          liffId: LIFF_ID,
          withLoginOnExternalBrowser: true
        });
        liffInitialized = true;
      }

      if (!liff.isLoggedIn()) {
        if (!liff.isInClient()) {
          liff.login();
          throw new Error("LINE 登入狀態已失效，正在重新登入。");
        }

        throw new Error("LINE 登入狀態已失效，請重新開啟系統。");
      }

      const token = liff.getIDToken();

      if (!token) {
        throw new Error("無法取得 LINE ID Token，請重新開啟系統。");
      }

      lineIdToken = String(token);
      return lineIdToken;
    }

    // ==========================================================
    // 重新初始化 LIFF 並取得新 Token
    //
    // ID Token 有效期為 1 小時。
    // 如果 GAS 回覆 IdToken expired，就重新初始化並重試一次。
    // ==========================================================

    async function refreshLineIdToken() {
      if (tokenRefreshing) {
        return tokenRefreshing;
      }

      tokenRefreshing = (async function() {
        if (typeof liff === "undefined") {
          throw new Error("LIFF SDK 尚未載入。");
        }

        if (!liff.isLoggedIn()) {
          if (!liff.isInClient()) {
            liff.login();
            throw new Error("LINE 登入狀態已失效，正在重新登入。");
          }

          throw new Error("LINE 登入狀態已失效，請重新開啟系統。");
        }

        // 重新執行 LIFF 初始化，讓 SDK 重新取得目前的 Token 狀態。
        await liff.init({
          liffId: LIFF_ID,
          withLoginOnExternalBrowser: true
        });

        liffInitialized = true;

        const newToken = liff.getIDToken();

        if (!newToken) {
          throw new Error("重新取得 LINE ID Token 失敗，請重新開啟系統。");
        }

        lineIdToken = String(newToken);

        return lineIdToken;
      })();

      try {
        return await tokenRefreshing;
      } finally {
        tokenRefreshing = null;
      }
    }

    // ==========================================================
    // 判斷是否為 Token 過期錯誤
    // ==========================================================

    function isExpiredTokenError(err) {
      const message = String(
        err && err.message ? err.message : err || ""
      ).toLowerCase();

      return (
        message.includes("idtoken expired") ||
        message.includes("id token expired") ||
        message.includes("token expired") ||
        message.includes("invalid id token") ||
        message.includes("invalid_id_token")
      );
    }

    // ==========================================================
    // 接收 GAS API 回傳
    // ==========================================================

    window.addEventListener("message", function(event) {
      const message = event && event.data;

      if (!message || message.channel !== GAS_API_CHANNEL) {
        return;
      }

      const pending = pendingApiRequests.get(message.requestId);

      if (!pending) {
        return;
      }

      pendingApiRequests.delete(message.requestId);

      if (pending.iframe && pending.iframe.parentNode) {
        pending.iframe.parentNode.removeChild(pending.iframe);
      }

      if (message.response && message.response.ok) {
        pending.resolve(message.response.data);
      } else {
        pending.reject(
          new Error(
            message.response && message.response.error
              ? message.response.error
              : "GAS API 發生未知錯誤。"
          )
        );
      }
    });

    // ==========================================================
    // 實際送出 GAS API
    // ==========================================================

    function sendGasApiRequest(action, payload) {
      return new Promise(function(resolve, reject) {
        const requestId =
          "req_" +
          Date.now().toString(36) +
          "_" +
          Math.random().toString(36).slice(2);

        const iframe = document.createElement("iframe");
        iframe.name = requestId;
        iframe.style.display = "none";
        iframe.setAttribute("aria-hidden", "true");
        document.body.appendChild(iframe);

        pendingApiRequests.set(requestId, {
          resolve,
          reject,
          iframe
        });

        const form = document.createElement("form");
        form.method = "POST";
        form.action = GAS_API_URL;
        form.target = requestId;
        form.style.display = "none";

        const requestInput = document.createElement("input");
        requestInput.type = "hidden";
        requestInput.name = "requestId";
        requestInput.value = requestId;

        const payloadInput = document.createElement("input");
        payloadInput.type = "hidden";
        payloadInput.name = "payload";
        payloadInput.value = JSON.stringify(
          Object.assign({}, payload || {}, { action })
        );

        form.appendChild(requestInput);
        form.appendChild(payloadInput);
        document.body.appendChild(form);

        form.submit();
        form.remove();

        setTimeout(function() {
          const pendingRequest = pendingApiRequests.get(requestId);

          if (!pendingRequest) {
            return;
          }

          pendingApiRequests.delete(requestId);

          if (iframe.parentNode) {
            iframe.parentNode.removeChild(iframe);
          }

          reject(
            new Error("伺服器回應逾時，請確認 GAS Web App 已重新部署。")
          );
        }, 30000);
      });
    }

    // ==========================================================
    // GAS API
    //
    // 重點：
    // 每次 API 呼叫前都取得目前 ID Token。
    // 如果第一次收到 expired，再重新初始化 LIFF 並重試一次。
    // ==========================================================

    async function callGasApi(action, payload) {
      const requestPayload = Object.assign({}, payload || {});

      requestPayload.idToken = await getCurrentLineIdToken();

      try {
        return await sendGasApiRequest(action, requestPayload);
      } catch (err) {
        if (!isExpiredTokenError(err)) {
          throw err;
        }

        console.warn("LINE ID Token 已過期，正在重新取得 Token...", err);

        requestPayload.idToken = await refreshLineIdToken();

        return await sendGasApiRequest(action, requestPayload);
      }
    }

    // ==========================================================
    // 頁面載入
    // ==========================================================

    window.addEventListener("load", initSystem);

    async function initSystem() {
      const loading = document.getElementById("loading");

      try {
        if (typeof liff === "undefined") {
          throw new Error("LIFF SDK 尚未載入。");
        }

        loading.innerHTML = "正在初始化 LINE 身分...";

        await liff.init({
          liffId: LIFF_ID,
          withLoginOnExternalBrowser: true
        });

        liffInitialized = true;

        console.log(
          "LIFF 初始化成功",
          liff.getVersion(),
          liff.isInClient(),
          liff.isLoggedIn()
        );

        if (!liff.isLoggedIn()) {
          throw new Error("LINE 登入尚未完成。請重新從 LINE 開啟系統。");
        }

        loading.innerHTML = "正在取得 LINE 身分驗證資訊...";

        lineIdToken = await getCurrentLineIdToken();

        loading.innerHTML = "正在驗證 LINE 身分...";

        const verifiedUser = await sendGasApiRequest(
          "verifyLineIdToken",
          { idToken: lineIdToken }
        );

        if (!verifiedUser || !verifiedUser.userId) {
          throw new Error("伺服器沒有回傳有效的 LINE User ID。");
        }

        userLineId = String(verifiedUser.userId).trim();

        console.log(
          "LINE User ID 已由 LINE Platform 驗證取得",
          userLineId
        );

        loading.innerHTML = "正在確認您的會員資料...";

        const bindings = await callGasApi(
          "checkLineId",
          { idToken: lineIdToken }
        );

        onCheckBindResult(bindings);
      } catch (err) {
        console.error("LIFF / API ERROR:", err);

        showError(
          "LINE 身分確認失敗",
          err && err.message ? err.message : err
        );
      }
    }

    // ==========================================================
    // 顯示錯誤
    // ==========================================================

    function showError(title, message) {
      const loading = document.getElementById("loading");

      loading.innerHTML =
        "<div class='error-box'>" +
        "<b>❌ " + escapeHtml(title) + "</b><br><br>" +
        escapeHtml(String(message)) +
        "</div>";
    }

    // ==========================================================
    // HTML Escape
    // ==========================================================

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // ==========================================================
    // GAS 伺服器錯誤
    // ==========================================================

    function onServerFail(err) {
      console.error("Server Error:", err);

      showError(
        "伺服器連線發生錯誤",
        err && err.message ? err.message : err
      );
    }

    // ==========================================================
    // 第一次綁定：關係選擇
    // ==========================================================

    function handleRelationChange() {
      const relation = document.getElementById("bind-relation").value;
      const otherGroup = document.getElementById("bind-other-relation-group");
      const otherInput = document.getElementById("bind-other-relation");

      if (relation === "其他") {
        otherGroup.classList.remove("hidden");
        otherInput.focus();
      } else {
        otherGroup.classList.add("hidden");
        otherInput.value = "";
      }
    }

    // ==========================================================
    // 第一次綁定
    // ==========================================================

    async function handleBind() {
      const studentName = document.getElementById("bind-student").value.trim();
      let relation = document.getElementById("bind-relation").value;

      if (relation === "其他") {
        const otherRelation = document
          .getElementById("bind-other-relation")
          .value
          .trim();

        if (!otherRelation) {
          alert("請填寫您與學員的關係！");
          return;
        }

        relation = otherRelation;
      }

      if (!studentName) {
        alert("請輸入學員姓名！");
        return;
      }

      try {
        await getCurrentLineIdToken();

        await callGasApi("registerUser", {
          idToken: lineIdToken,
          studentName,
          relation
        });

        alert("綁定成功！");

        userBindings.push({
          studentName,
          relation
        });

        document.getElementById("bind-section").classList.add("hidden");
        showMainSection();
      } catch (err) {
        alert(
          "綁定失敗：" +
          (err && err.message ? err.message : err)
        );
      }
    }

    // ==========================================================
    // 顯示主畫面
    // ==========================================================

    function showMainSection() {
      document.getElementById("main-section").classList.remove("hidden");

      updateMemberSelect();

      document.getElementById("user-info-text").innerText =
        "👋 您好，系統已自動確認您的 LINE 身分。";

      onStudentChange();
    }

    // ==========================================================
    // 更新成員選單
    // ==========================================================

    function updateMemberSelect() {
      const select = document.getElementById("student-select");
      const currentStudent = select.value;

      select.innerHTML = "";

      userBindings.forEach(function(binding) {
        const opt = document.createElement("option");
        opt.value = binding.studentName;
        opt.text =
          binding.studentName +
          "（" +
          binding.relation +
          "）";

        select.appendChild(opt);
      });

      if (
        currentStudent &&
        userBindings.some(function(binding) {
          return binding.studentName === currentStudent;
        })
      ) {
        select.value = currentStudent;
      }

      if (!select.value && userBindings.length > 0) {
        select.selectedIndex = 0;
      }

      updateMemberCount();
    }

    // ==========================================================
    // 更新成員數量
    // ==========================================================

    function updateMemberCount() {
      const countElement = document.getElementById("member-count");

      if (!countElement) {
        return;
      }

      countElement.innerText =
        "目前 " +
        userBindings.length +
        " 位成員";
    }

    // ==========================================================
    // 顯示新增成員
    // ==========================================================

    function showAddMember() {
      const box = document.getElementById("add-member-box");
      box.classList.remove("hidden");
      document.getElementById("add-student").focus();
    }

    // ==========================================================
    // 取消新增成員
    // ==========================================================

    function cancelAddMember() {
      clearAddMemberForm();
      document.getElementById("add-member-box").classList.add("hidden");
    }

    // ==========================================================
    // 清除新增成員表單
    // ==========================================================

    function clearAddMemberForm() {
      document.getElementById("add-student").value = "";
      document.getElementById("add-relation").value = "爸爸";
      document.getElementById("add-other-relation").value = "";
      document.getElementById("add-other-relation-group").classList.add("hidden");
    }

    // ==========================================================
    // 新增成員：關係選擇
    // ==========================================================

    function handleAddRelationChange() {
      const relation = document.getElementById("add-relation").value;
      const otherGroup = document.getElementById("add-other-relation-group");
      const otherInput = document.getElementById("add-other-relation");

      if (relation === "其他") {
        otherGroup.classList.remove("hidden");
        otherInput.focus();
      } else {
        otherGroup.classList.add("hidden");
        otherInput.value = "";
      }
    }

    // ==========================================================
    // 新增第二、第三位成員
    // ==========================================================

    async function handleAddMember() {
      const studentName = document.getElementById("add-student").value.trim();
      let relation = document.getElementById("add-relation").value;

      if (relation === "其他") {
        const otherRelation = document
          .getElementById("add-other-relation")
          .value
          .trim();

        if (!otherRelation) {
          alert("請填寫您與學員的關係！");
          return;
        }

        relation = otherRelation;
      }

      if (!studentName) {
        alert("請輸入學員姓名！");
        return;
      }

      const alreadyExists = userBindings.some(function(binding) {
        return binding.studentName === studentName;
      });

      if (alreadyExists) {
        alert("這位成員已經綁定，不需要重複新增。");
        return;
      }

      try {
        await getCurrentLineIdToken();

        await callGasApi("registerUser", {
          idToken: lineIdToken,
          studentName,
          relation
        });

        alert("新增成員成功！");

        userBindings.push({
          studentName,
          relation
        });

        updateMemberSelect();

        document.getElementById("student-select").value = studentName;

        cancelAddMember();
        onStudentChange();
      } catch (err) {
        alert(
          "新增成員失敗：" +
          (err && err.message ? err.message : err)
        );
      }
    }

    // ==========================================================
    // 成員切換
    // ==========================================================

    function onStudentChange() {
      loadHistory();

      if (currentTab === "makeup") {
        loadValidLeaveDates();
      }
    }

    // ==========================================================
    // 分頁
    // ==========================================================

    function switchTab(tab) {
      currentTab = tab;

      const tabs = document.querySelectorAll(".tab");

      tabs.forEach(function(tabElement) {
        tabElement.classList.remove("active");
      });

      if (tab === "leave") {
        tabs[0].classList.add("active");

        document.getElementById("leave-form-pane").classList.remove("hidden");
        document.getElementById("makeup-form-pane").classList.add("hidden");

        document.getElementById("history-title").innerText =
          "📋 近期請假紀錄";
      } else {
        tabs[1].classList.add("active");

        document.getElementById("makeup-form-pane").classList.remove("hidden");
        document.getElementById("leave-form-pane").classList.add("hidden");

        document.getElementById("history-title").innerText =
          "📋 近期預約補課紀錄";

        loadValidLeaveDates();
      }

      loadHistory();
    }

    // ==========================================================
    // 補課時段
    // ==========================================================

    function handleSlotChange() {
      const slotSelect = document.getElementById("makeup-slot-select").value;
      const otherGroup = document.getElementById("makeup-other-group");

      if (slotSelect === "其他") {
        otherGroup.classList.remove("hidden");
      } else {
        otherGroup.classList.add("hidden");
        document.getElementById("makeup-other-input").value = "";
      }
    }

    // ==========================================================
    // 載入歷史紀錄
    // ==========================================================

    async function loadHistory() {
      const select = document.getElementById("student-select");

      if (!select || !select.value) {
        return;
      }

      const studentName = select.value;
      const action =
        currentTab === "leave"
          ? "getLeaveHistory"
          : "getMakeupHistory";

      try {
        const history = await callGasApi(action, {
          idToken: lineIdToken,
          studentName
        });

        renderHistory(history);
      } catch (err) {
        onServerFail(err);
      }
    }

    // ==========================================================
    // 顯示歷史紀錄
    // ==========================================================

    function renderHistory(history) {
      const listDiv = document.getElementById("history-list");

      if (!history || history.length === 0) {
        listDiv.innerHTML =
          "<div style='color:#94a3b8;font-size:13px;text-align:center;padding:10px;'>" +
          "目前沒有相關紀錄" +
          "</div>";

        return;
      }

      let html = "";

      history.forEach(function(h) {
        let info = "";

        if (currentTab === "leave") {
          info =
            "原因：" +
            escapeHtml(h.reason || "無");
        } else {
          info =
            "原請假日期：" +
            escapeHtml(h.originalDate || "未指定") +
            " | 備註：" +
            escapeHtml(h.remark || "");
        }

        const deleteButton =
          currentTab === "leave" &&
          h.status === "已生效"
            ? "<button class='delete-leave-button' onclick='deleteLeave(" +
              JSON.stringify(h.date) +
              ")'>刪除</button>"
            : "";

        html +=
          "<div class='history-card'>" +
          "<div class='history-row'>" +
          "<div class='history-content'>" +
          "<b>日期：" +
          escapeHtml(h.date || "") +
          "</b> | 狀態：" +
          "<span style='color:#4f46e5;'>" +
          escapeHtml(h.status || "") +
          "</span><br>" +
          info +
          "</div>" +
          deleteButton +
          "</div>" +
          "</div>";
      });

      listDiv.innerHTML = html;
    }

    // ==========================================================
    // 刪除已生效請假
    // ==========================================================

    async function deleteLeave(date) {
      const studentName = document.getElementById("student-select").value;

      if (!studentName || !date) {
        return;
      }

      const confirmed = confirm(
        "確定要刪除 " +
        date +
        " 的請假紀錄嗎？\n\n刪除後將無法復原。"
      );

      if (!confirmed) {
        return;
      }

      try {
        await callGasApi("deleteLeaveRecord", {
          idToken: lineIdToken,
          studentName,
          date
        });

        alert("請假紀錄已刪除。");

        await loadHistory();

        if (currentTab === "makeup") {
          loadValidLeaveDates();
        }
      } catch (err) {
        alert(
          "刪除失敗：" +
          (err && err.message ? err.message : err)
        );
      }
    }

    // ==========================================================
    // 載入可補課的請假日期
    // ==========================================================

    async function loadValidLeaveDates() {
      const studentName = document.getElementById("student-select").value;
      const selectOriginal = document.getElementById("makeup-original-date");

      selectOriginal.innerHTML =
        "<option value=''>載入中...</option>";

      if (!studentName) {
        selectOriginal.innerHTML =
          "<option value=''>-- 請先選擇成員 --</option>";

        return;
      }

      try {
        const leaves = await callGasApi("getValidLeaveDates", {
          idToken: lineIdToken,
          studentName
        });

        selectOriginal.innerHTML = "";

        if (!leaves || leaves.length === 0) {
          selectOriginal.innerHTML =
            "<option value=''>⚠️ 該成員目前沒有可用的請假紀錄</option>";

          return;
        }

        const defaultOpt = document.createElement("option");
        defaultOpt.value = "";
        defaultOpt.text = "-- 請選擇要補哪一天的缺 --";
        selectOriginal.appendChild(defaultOpt);

        leaves.forEach(function(leave) {
          const opt = document.createElement("option");

          opt.value = leave.date;
          opt.text =
            "📅 原請假日期：" +
            leave.date +
            "（原因：" +
            (leave.reason || "無") +
            "）";

          selectOriginal.appendChild(opt);
        });
      } catch (err) {
        onServerFail(err);
      }
    }

    // ==========================================================
    // 送出請假
    // ==========================================================

    async function submitLeave() {
      const studentName = document.getElementById("student-select").value;
      const date = document.getElementById("leave-date").value;
      const remark = document.getElementById("leave-remark").value;

      if (!studentName) {
        alert("請先選擇成員！");
        return;
      }

      if (!date) {
        alert("請選擇請假日期！");
        return;
      }

      const binding = userBindings.find(function(b) {
        return b.studentName === studentName;
      });

      try {
        await callGasApi("saveLeaveRecord", {
          idToken: lineIdToken,
          relation: binding ? binding.relation : "家長",
          studentName,
          date,
          remark
        });

        alert("請假申請已送出！");

        document.getElementById("leave-date").value = "";
        document.getElementById("leave-remark").value = "";

        loadHistory();
      } catch (err) {
        alert(
          "送出失敗：" +
          (err && err.message ? err.message : err)
        );
      }
    }

    // ==========================================================
    // 送出補課
    // ==========================================================

    async function submitMakeup() {
      const studentName = document.getElementById("student-select").value;
      const originalDate = document.getElementById("makeup-original-date").value;
      const date = document.getElementById("makeup-date").value;
      const slotSelect = document.getElementById("makeup-slot-select").value;
      const otherInput = document.getElementById("makeup-other-input").value.trim();

      const remark =
        slotSelect === "其他"
          ? otherInput
            ? "其他：" + otherInput
            : "其他"
          : slotSelect;

      if (!studentName) {
        alert("請先選擇成員！");
        return;
      }

      if (!originalDate) {
        alert("請選擇您要抵扣的原請假日期！");
        return;
      }

      if (!date) {
        alert("請選擇預約補課日期！");
        return;
      }

      if (!slotSelect) {
        alert("請選擇補課時段！");
        return;
      }

      if (slotSelect === "其他" && !otherInput) {
        alert("請填寫其他補課時段 / 備註！");
        return;
      }

      const binding = userBindings.find(function(b) {
        return b.studentName === studentName;
      });

      try {
        await callGasApi("saveMakeupRecord", {
          idToken: lineIdToken,
          relation: binding ? binding.relation : "家長",
          studentName,
          originalDate,
          date,
          remark
        });

        alert("補課預約已送出！");

        document.getElementById("makeup-date").value = "";
        document.getElementById("makeup-slot-select").value = "";
        document.getElementById("makeup-other-input").value = "";
        document.getElementById("makeup-other-group").classList.add("hidden");

        loadValidLeaveDates();
        loadHistory();
      } catch (err) {
        alert(
          "送出失敗：" +
          (err && err.message ? err.message : err)
        );
      }
    }

    // ==========================================================
    // LINE ID 查詢結果
    // ==========================================================

    function onCheckBindResult(result) {
      userBindings = Array.isArray(result) ? result : [];

      document.getElementById("loading").classList.add("hidden");

      if (userBindings.length === 0) {
        document.getElementById("bind-section").classList.remove("hidden");
      } else {
        showMainSection();
      }
    }
  </script>
</body>
</html>
