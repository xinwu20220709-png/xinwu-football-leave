<script>

// ================================================================
// 基本設定
// ================================================================

const LIFF_ID =
  "2011307172-d3esgseq";


const GAS_API_URL =
  "https://script.google.com/macros/s/AKfycbwqh0a6HoNJi13iIjgOHrHq0gCSU6NipXkAjz2VquvtOYk20c72vdj6DjgoriPrvzg/exec";


const GAS_API_CHANNEL =
  "NEW屋_SOCCER_GAS_API";


const RELOGIN_KEY =
  "newwu_liff_relogin_attempt_v2";


let lineIdToken = "";

let userLineId = "";

let userBindings = [];

let currentTab = "leave";

let liffInitialized = false;

let reloginInProgress = false;


const pendingApiRequests =
  new Map();


// ================================================================
// 送出狀態
// ================================================================

const submittingState = {

  bind: false,

  addMember: false,

  leave: false,

  makeup: false

};


// ================================================================
// GAS iframe postMessage
// ================================================================

window.addEventListener(
  "message",
  function(event) {

    const message =
      event &&
      event.data;


    if (
      !message ||
      message.channel !==
        GAS_API_CHANNEL
    ) {

      return;
    }


    const requestId =
      message.requestId;


    if (!requestId) {

      return;
    }


    const pending =
      pendingApiRequests.get(
        requestId
      );


    if (!pending) {

      return;
    }


    pendingApiRequests.delete(
      requestId
    );


    clearTimeout(
      pending.timer
    );


    if (
      pending.iframe &&
      pending.iframe.parentNode
    ) {

      pending.iframe.parentNode.removeChild(
        pending.iframe
      );
    }


    if (
      message.response &&
      message.response.ok
    ) {

      pending.resolve(
        message.response.data
      );

    } else {

      pending.reject(
        new Error(
          message.response &&
          message.response.error
            ? message.response.error
            : "GAS API 發生未知錯誤。"
        )
      );
    }

  }
);


// ================================================================
// 呼叫 GAS
// ================================================================

function sendGasApiRequest(
  action,
  payload
) {

  return new Promise(
    function(resolve, reject) {

      const requestId =
        "req_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
          .toString(36)
          .slice(2);


      const iframe =
        document.createElement(
          "iframe"
        );


      iframe.name =
        requestId;

      iframe.style.display =
        "none";

      iframe.setAttribute(
        "aria-hidden",
        "true"
      );


      document.body.appendChild(
        iframe
      );


      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";

      form.action =
        GAS_API_URL;

      form.target =
        requestId;

      form.style.display =
        "none";


      const requestIdInput =
        document.createElement(
          "input"
        );


      requestIdInput.type =
        "hidden";

      requestIdInput.name =
        "requestId";

      requestIdInput.value =
        requestId;


      const payloadInput =
        document.createElement(
          "input"
        );


      payloadInput.type =
        "hidden";

      payloadInput.name =
        "payload";

      payloadInput.value =
        JSON.stringify(
          Object.assign(
            {},
            payload || {},
            {
              action:
                action
            }
          )
        );


      form.appendChild(
        requestIdInput
      );

      form.appendChild(
        payloadInput
      );


      document.body.appendChild(
        form
      );


      const timer =
        setTimeout(
          function() {

            const pending =
              pendingApiRequests.get(
                requestId
              );


            if (!pending) {
              return;
            }


            pendingApiRequests.delete(
              requestId
            );


            if (
              iframe.parentNode
            ) {

              iframe.parentNode.removeChild(
                iframe
              );
            }


            reject(
              new Error(
                "伺服器回應逾時，請確認 GAS Web App 已重新部署。"
              )
            );

          },
          30000
        );


      pendingApiRequests.set(
        requestId,
        {
          resolve:
            resolve,

          reject:
            reject,

          iframe:
            iframe,

          timer:
            timer
        }
      );


      try {

        form.submit();

      } catch (error) {

        pendingApiRequests.delete(
          requestId
        );

        clearTimeout(
          timer
        );


        if (
          iframe.parentNode
        ) {

          iframe.parentNode.removeChild(
            iframe
          );
        }


        reject(
          error
        );
      }


      if (
        form.parentNode
      ) {

        form.parentNode.removeChild(
          form
        );
      }

    }
  );
}


// ================================================================
// 判斷 Token 過期
// ================================================================

function isExpiredTokenError(
  err
) {

  const message =
    String(
      err &&
      err.message
        ? err.message
        : err || ""
    ).toLowerCase();


  return (

    message.includes(
      "idtoken expired"
    ) ||

    message.includes(
      "id token expired"
    ) ||

    message.includes(
      "token expired"
    ) ||

    message.includes(
      "invalid id token"
    ) ||

    message.includes(
      "invalid_id_token"
    ) ||

    message.includes(
      "line token 已過期"
    ) ||

    message.includes(
      "line 身分驗證失敗"
    )

  );
}


// ================================================================
// 初始化 LIFF
// ================================================================

async function ensureLiffInitialized() {

  if (
    typeof liff === "undefined"
  ) {

    throw new Error(
      "LIFF SDK 尚未載入。"
    );
  }


  if (
    !liffInitialized
  ) {

    await liff.init({

      liffId:
        LIFF_ID,

      withLoginOnExternalBrowser:
        true

    });


    liffInitialized =
      true;
  }
}


// ================================================================
// LIFF redirect URI
// ================================================================

function getReloginRedirectUri() {

  const params =
    new URLSearchParams(
      location.search
    );


  const state =
    params.get(
      "liff.state"
    );


  if (state) {

    try {

      return new URL(
        "." + state,
        location.href
      ).toString();

    } catch (e) {

      console.warn(
        "無法解析 liff.state：",
        e
      );
    }
  }


  return location.href
    .split("#")[0];
}


// ================================================================
// 強制 LINE 重新登入
// ================================================================

async function forceLineLogin(
  reason
) {

  if (
    reloginInProgress
  ) {

    return;
  }


  reloginInProgress =
    true;


  sessionStorage.setItem(
    RELOGIN_KEY,
    "1"
  );


  const loading =
    document.getElementById(
      "loading"
    );


  loading.classList.remove(
    "hidden"
  );


  loading.innerHTML =
    "<div>" +
    "LINE 登入資訊已過期。<br>" +
    "正在清除舊登入狀態並重新登入...<br>" +
    "<small>若沒有自動跳轉，請按重新登入。</small>" +
    "</div>" +
    "<button class='login-button' " +
    "onclick='manualLineLogin()'>" +
    "重新登入 LINE" +
    "</button>";


  try {

    if (
      liff.isLoggedIn() &&
      !liff.isInClient()
    ) {

      liff.logout();
    }

  } catch (error) {

    console.warn(
      "liff.logout：",
      error
    );
  }


  setTimeout(
    function() {

      manualLineLogin();

    },
    500
  );
}


// ================================================================
// 手動 LINE 登入
// ================================================================

function manualLineLogin() {

  try {

    sessionStorage.setItem(
      RELOGIN_KEY,
      "1"
    );


    const uri =
      getReloginRedirectUri();


    if (
      !liff.isInClient()
    ) {

      liff.login({
        redirectUri:
          uri
      });

    } else {

      location.reload();
    }

  } catch (error) {

    showError(
      "LINE 登入失敗",
      error.message ||
        error
    );
  }
}


// ================================================================
// 取得最新 LINE ID Token
// ================================================================

async function getCurrentLineIdToken() {

  await ensureLiffInitialized();


  if (
    !liff.isLoggedIn()
  ) {

    if (
      !liff.isInClient()
    ) {

      liff.login({

        redirectUri:
          getReloginRedirectUri()

      });


      throw new Error(
        "正在重新登入 LINE..."
      );
    }


    throw new Error(
      "LINE 登入狀態已失效，請重新開啟系統。"
    );
  }


  const token =
    liff.getIDToken();


  if (!token) {

    throw new Error(
      "無法取得 LINE ID Token，請重新登入 LINE。"
    );
  }


  lineIdToken =
    String(token);


  return lineIdToken;
}


// ================================================================
// API wrapper
//
// 每一次 API 都重新取得 token。
// ================================================================

async function callGasApi(
  action,
  payload
) {

  const token =
    await getCurrentLineIdToken();


  const body =
    Object.assign(
      {},
      payload || {},
      {
        idToken:
          token
      }
    );


  try {

    return await sendGasApiRequest(
      action,
      body
    );

  } catch (error) {

    if (
      !isExpiredTokenError(
        error
      )
    ) {

      throw error;
    }


    console.warn(
      "LINE ID Token expired，重新登入。",
      error
    );


    await forceLineLogin(
      error
    );


    throw new Error(
      "IdToken expired，正在重新登入 LINE..."
    );
  }
}

window.addEventListener(

);


async function initSystem() {

  const loading =
    document.getElementById(
      "loading"
    );


  try {

    await ensureLiffInitialized();


    console.log(
      "LIFF",
      liff.getVersion(),
      "inClient",
      liff.isInClient(),
      "loggedIn",
      liff.isLoggedIn()
    );


    if (
      !liff.isLoggedIn()
    ) {

      if (
        !liff.isInClient()
      ) {

        loading.innerHTML =
          "正在前往 LINE 登入...";


        liff.login({

          redirectUri:
            getReloginRedirectUri()

        });


        return;
      }


      throw new Error(
        "LINE 登入尚未完成，請重新開啟系統。"
      );
    }


    loading.innerHTML =
      "正在取得 LINE 身分驗證資訊...";


    lineIdToken =
      await getCurrentLineIdToken();


    loading.innerHTML =
      "正在驗證 LINE 身分...";


    const verifiedUser =
      await callGasApi(
        "verifyLineIdToken",
        {}
      );


    if (
      !verifiedUser ||
      !verifiedUser.userId
    ) {

      throw new Error(
        "伺服器沒有回傳有效的 LINE User ID。"
      );
    }


    userLineId =
      String(
        verifiedUser.userId
      ).trim();


    sessionStorage.removeItem(
      RELOGIN_KEY
    );


    loading.innerHTML =
      "正在確認您的會員資料...";


    const bindings =
      await callGasApi(
        "checkLineId",
        {}
      );


    onCheckBindResult(
      bindings
    );


  } catch (error) {

    console.error(
      "LIFF/API ERROR",

    );


    if (
      isExpiredTokenError(
        error
      )
    ) {

      await forceLineLogin(
        error
      );

    }


    showError(
      "LINE 身分確認失敗",

    );

// ================================================================
// HTML escape
// ================================================================

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


// ================================================================
// 今天
// ================================================================

function todayString() {

  const d =
    new Date();


  const y =
    d.getFullYear();


  const m =
    String(
      d.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    y +
    "-" +
    m +
    "-" +
    day
  );
}

// ================================================================
// 統一解析歷史資料
// ================================================================

function normalizeHistoryResult(
  result
) {

  if (
    Array.isArray(result)
  ) {

    return result;
  }


  if (
    result &&
    Array.isArray(
      result.history
    )
  ) {

    return result.history;
  }


  if (
    result &&
    Array.isArray(
      result.data
    )
  ) {

    return result.data;
  }


  return [];
}


// ================================================================
// 顯示歷史
// ================================================================

function renderHistory(
  result
) {

  const history =
    normalizeHistoryResult(
      result
    );


  const list =
    document.getElementById(
      "history-list"
    );


  if (
    !history.length
  ) {

    list.innerHTML =
      "<div style='color:#94a3b8;font-size:13px;text-align:center;padding:10px'>" +
      "目前沒有相關紀錄" +
      "</div>";


    return;
  }


  let html = "";


  history.forEach(
    function(item) {

      const info =
        currentTab === "leave"

          ? "原因：" +
            escapeHtml(
              item.reason ||
              "無"
            )

          : "原請假日期：" +
            escapeHtml(
              item.originalDate ||
              "未指定"
            ) +
            " | 備註：" +
            escapeHtml(
              item.remark ||
              ""
            );


      const canDelete =
        currentTab === "leave" &&
        (
          item.status ===
            "已生效" ||

          item.status ===
            "已核准"
        );


      let deleteButton =
        "";


      if (
        canDelete
      ) {

        deleteButton =
          "<button " +
          "class='delete-leave-button' " +
          "onclick='deleteLeave(" +
          JSON.stringify(
            item.date || ""
          ) +
          ")'>" +
          "刪除" +
          "</button>";
      }


      html +=

        "<div class='history-card'>" +

        "<div class='history-row'>" +

        "<div class='history-content'>" +

        "<b>日期：" +

        escapeHtml(
          item.date ||
          ""
        ) +

        "</b> | 狀態：" +

        "<span style='color:#4f46e5'>" +

        escapeHtml(
          item.status ||
          ""
        ) +

        "</span>" +

        "<br>" +

        info +

        "</div>" +

        deleteButton +

        "</div>" +

        "</div>";
    }
  );


  list.innerHTML =
    html;
}

    );

    return;
  }


  if (!slot) {

    alert(
      "請選擇補課時段！"
    );

    return;
  }


  if (
    slot === "其他" &&
    !other
  ) {

    alert(
      "請填寫其他補課時段 / 備註！"
    );

    return;
  }


  const binding =
    userBindings.find(
      function(item) {

        return (
          item.studentName ===
          name
        );
      }
    );


  const remark =
    slot === "其他"
      ? "其他：" + other
      : slot;


  submittingState.makeup =
    true;


  const button =
    document.getElementById(
      "submit-makeup-button"
    );


  button.disabled =
    true;

  button.textContent =
    "送出中...";


  try {

    await callGasApi(
      "saveMakeupRecord",
      {

        relation:
          binding
            ? binding.relation
            : "家長",

        studentName:
          name,

        originalDate:
          originalDate,

        date:
          date,

        remark:
          remark

      }
    );


    alert(
      "補課預約已送出！"
    );


    document
      .getElementById(
        "makeup-date"
      )
      .value =
      todayString();


    document
      .getElementById(
        "makeup-slot-select"
      )
      .value =
      "";


    document
      .getElementById(
        "makeup-other-input"
      )
      .value =
      "";


    document
      .getElementById(
        "makeup-other-group"
      )
      .classList.add(
        "hidden"
      );


    await loadValidLeaveDates();

    await loadHistory();


  } catch (error) {

    if (
      isExpiredTokenError(
        error
      )
    ) {

      await forceLineLogin(
        error
      );

      return;
    }


    alert(
      "送出失敗：" +
      (
        error.message ||
        error
      )
    );

  } finally {

    submittingState.makeup =
      false;

    button.disabled =
      false;

    button.textContent =
      "送出補課預約";
  }
}


// ================================================================
// 刪除請假
// ================================================================

async function deleteLeave(
  date
) {

  const name =
    document
      .getElementById(
        "student-select"
      )
      .value;


  if (
    !name ||
    !date
  ) {

    return;
  }


  if (
    !confirm(
      "確定要刪除 " +
      date +
      " 的請假紀錄嗎？\n\n" +
      "刪除後將無法復原。"
    )
  ) {

    return;
  }


  try {

    await callGasApi(
      "deleteLeaveRecord",
      {

        studentName:
          name,

        date:
          date

      }
    );


    alert(
      "請假紀錄已刪除。"
    );


    await loadHistory();


    if (
      currentTab ===
      "makeup"
    ) {

      await loadValidLeaveDates();
    }


  } catch (error) {

    if (
      isExpiredTokenError(
        error
      )
    ) {

      await forceLineLogin(
        error
      );

      return;
    }


    alert(
      "刪除失敗：" +
      (
        error.message ||
        error
      )
    );
  }
}


// ================================================================
// 綁定結果
// ================================================================

function onCheckBindResult(
  result
) {

  userBindings =
    Array.isArray(result)
      ? result
      : [];


  document
    .getElementById(
      "loading"
    )
    .classList.add(
      "hidden"
    );


  if (
    !userBindings.length
  ) {

    document
      .getElementById(
        "bind-section"
      )
      .classList.remove(
        "hidden"
      );


  } else {

    showMainSection();
  }
}

</script>
