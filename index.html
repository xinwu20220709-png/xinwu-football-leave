<!DOCTYPE html>
<html>
<head>

  <base target="_top">

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    新屋足球俱樂部 - 請假與補課系統
  </title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --navy: #0f2742;
      --navy-2: #173b5f;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --green: #16a34a;
      --green-soft: #f0fdf4;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --text: #1e293b;
      --muted: #64748b;
      --border: #dbe4ee;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #eef3f8;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans TC",
        sans-serif;
      background:
        radial-gradient(circle at 50% -10%, #dbeafe 0, #eef3f8 38%, #eef3f8 100%);
      margin: 0;
      padding: 22px 14px 40px;
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: rgba(255,255,255,.97);
      padding: 26px 22px 28px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,.9);
      box-shadow:
        0 18px 50px rgba(15,39,66,.10),
        0 3px 12px rgba(15,39,66,.06);
    }

    h2 {
      color: var(--navy);
      text-align: center;
      margin: 2px 0 22px;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .tabs {
      display: flex;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
      gap: 4px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 11px 10px 13px;
      cursor: pointer;
      font-weight: 700;
      color: #94a3b8;
      font-size: 15px;
      transition: .2s ease;
      position: relative;
    }

    .tab.active {
      color: var(--blue);
      border-bottom: 0;
      margin-bottom: 0;
    }

    .tab.active::after {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: -1px;
      height: 3px;
      border-radius: 99px;
      background: var(--blue);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
      font-size: 14px;
      color: #334155;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 11px;
      font-size: 15px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    input:hover,
    select:hover,
    textarea:hover {
      border-color: #94a3b8;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
      background: #fcfdff;
    }

    textarea {
      resize: vertical;
      min-height: 74px;
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      padding: 13px 14px;
      border-radius: 11px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 5px 14px rgba(37,99,235,.18);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }

    button:hover {
      filter: brightness(.97);
      box-shadow: 0 7px 18px rgba(37,99,235,.22);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .hidden {
      display: none !important;
    }

    .notice {
      background: var(--blue-soft);
      border: 1px solid #bfdbfe;
      border-left: 4px solid var(--blue);
      padding: 12px 13px;
      font-size: 13px;
      margin-bottom: 18px;
      border-radius: 10px;
      color: #1e40af;
      line-height: 1.6;
    }

    .member-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
    }

    .member-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .member-header-left label {
      margin: 0;
      font-size: 15px;
      color: #334155;
    }

    .member-count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .add-member-button,
    .manage-member-button {
      width: auto;
      margin: 0;
      padding: 7px 12px;
      border-radius: 9px;
      font-size: 13px;
      box-shadow: none;
      white-space: nowrap;
    }

    .add-member-button {
      background: var(--green);
    }

    .add-member-button:hover {
      background: #15803d;
    }

    .manage-member-button {
      background: var(--navy-2);
    }

    .manage-member-button:hover {
      background: var(--navy);
    }

    /* ============================================================
       成員管理：精緻化圖示與刪除按鈕
       ============================================================ */
    .manage-member-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .manage-member-icon {
      width: 17px;
      height: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 17px;
    }

    .manage-member-icon svg {
      width: 17px;
      height: 17px;
      display: block;
    }

    .add-member-box {
      background: var(--green-soft);
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .member-manager-box {
      background: linear-gradient(180deg, #f8fbff 0%, #f4f8fc 100%);
      border: 1px solid #d7e2ef;
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 18px;
      box-shadow: 0 4px 14px rgba(15,39,66,.045);
    }

    .member-manager-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 8px;
      font-size: 15px;
    }

    .member-manager-title-icon {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      background: #e6f0ff;
      color: var(--blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 31px;
    }

    .member-manager-title-icon svg {
      width: 18px;
      height: 18px;
    }

    .member-manager-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 2px;
      border-bottom: 1px solid #e2e8f0;
    }

    .member-manager-item:last-child {
      border-bottom: none;
    }

    .member-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      line-height: 1.45;
      font-size: 14px;
      color: #1e293b;
    }

    .member-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #e6f0ff;
      color: var(--blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 34px;
    }

    .member-avatar svg {
      width: 19px;
      height: 19px;
    }

    .member-delete-button {
      width: 38px;
      height: 38px;
      min-width: 38px;
      margin: 0;
      padding: 0;
      background: #fff;
      color: #ef4444;
      border: 1.5px solid #fda4af;
      border-radius: 10px;
      font-size: 0;
      box-shadow: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 38px;
    }

    .member-delete-button:hover {
      background: #fff5f5;
      color: #dc2626;
      border-color: #f87171;
      box-shadow: 0 3px 9px rgba(220,38,38,.10);
      transform: translateY(-1px);
    }

    .member-delete-button svg {
      width: 18px;
      height: 18px;
    }

    .add-member-title {
      font-size: 15px;
      font-weight: 800;
      color: #166534;
      margin-bottom: 12px;
    }

    .add-member-actions {
      display: flex;
      gap: 8px;
    }

    .add-member-actions button {
      flex: 1;
      margin-top: 0;
    }

    .cancel-button {
      background: #e2e8f0;
      color: #475569;
      box-shadow: none;
    }

    .cancel-button:hover {
      background: #cbd5e1;
      color: #334155;
    }

    .confirm-add-button {
      background: var(--green);
    }

    .confirm-add-button:hover {
      background: #15803d;
    }

    .history-card {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      padding: 13px;
      border-radius: 11px;
      margin-bottom: 9px;
      font-size: 13px;
      transition: box-shadow .15s ease, border-color .15s ease;
    }

    .history-card:hover {
      border-color: #c7d2fe;
      box-shadow: 0 4px 12px rgba(15,39,66,.05);
    }

    .history-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .history-content {
      flex: 1;
      min-width: 0;
      line-height: 1.65;
    }

    .delete-leave-button {
      width: auto;
      flex: 0 0 auto;
      margin: 0;
      padding: 6px 9px;
      border-radius: 7px;
      background: var(--red);
      font-size: 12px;
      box-shadow: none;
    }

    .delete-leave-button:hover {
      background: #b91c1c;
    }

    .error-box {
      background: var(--red-soft);
      border: 1px solid #fecaca;
      border-left: 4px solid #ef4444;
      padding: 12px;
      font-size: 13px;
      margin-top: 12px;
      border-radius: 9px;
      color: #991b1b;
      line-height: 1.55;
    }

    /* 讓系統在手機上更精緻 */
    @media (max-width: 560px) {
      body {
        padding: 10px 8px 28px;
      }

      .container {
        padding: 22px 16px 24px;
        border-radius: 20px;
      }

      h2 {
        font-size: 21px;
      }

      .member-header {
        align-items: flex-start;
      }

      .add-member-button,
      .manage-member-button {
        padding: 7px 10px;
      }

      .manage-member-icon {
        width: 16px;
        height: 16px;
        flex-basis: 16px;
      }

      .manage-member-icon svg {
        width: 16px;
        height: 16px;
      }

      .member-delete-button {
        width: 36px;
        height: 36px;
        min-width: 36px;
        flex-basis: 36px;
      }
    }
  </style>

</head>

<body>

<div class="container">

  <h2>
    ⚽ 新屋足球俱樂部
  </h2>


  <div
    id="loading"
    style="
      text-align:center;
      padding:30px;
      color:#64748b
    "
  >
    載入中，正在確認您的 LINE 身分...
  </div>


  <!-- ============================================================
       初次綁定
       ============================================================ -->

  <div
    id="bind-section"
    class="hidden"
  >

    <div class="notice">

      您好！這是您第一次使用本系統。<br>

      請先簡單綁定學員資料，之後即可直接使用。

    </div>


    <div class="form-group">

      <label>
        學員姓名
      </label>

      <input
        type="text"
        id="bind-student"
        maxlength="50"
        placeholder="例如：王小明"
      >

    </div>


    <div class="form-group">

      <label>
        您與學員的關係
      </label>

      <select
        id="bind-relation"
        onchange="handleRelationChange()"
      >

        <option value="爸爸">
          爸爸
        </option>

        <option value="媽媽">
          媽媽
        </option>

        <option value="阿公">
          阿公
        </option>

        <option value="阿嬤">
          阿嬤
        </option>

        <option value="其他">
          其他（自行填寫）
        </option>

      </select>

    </div>


    <div
      class="form-group hidden"
      id="bind-other-relation-group"
    >

      <label>
        請填寫您與學員的關係
      </label>

      <input
        type="text"
        id="bind-other-relation"
        maxlength="20"
        placeholder="例如：阿姨、叔叔、監護人"
      >

    </div>


    <button
      id="bind-button"
      onclick="handleBind()"
    >
      完成綁定並進入
    </button>

  </div>


  <!-- ============================================================
       主系統
       ============================================================ -->

  <div
    id="main-section"
    class="hidden"
  >

    <div
      class="notice"
      id="user-info-text"
    ></div>


    <div class="tabs">

      <div
        class="tab active"
        onclick="switchTab('leave')"
      >
        請假申請
      </div>

      <div
        class="tab"
        onclick="switchTab('makeup')"
      >
        預約補課
      </div>

    </div>


    <!-- ==========================================================
         成員
         ========================================================== -->

    <div class="form-group">

      <div class="member-header">

        <div class="member-header-left">

          <label>
            選擇成員
          </label>

          <span
            class="member-count"
            id="member-count"
          >
            目前 0 位成員
          </span>

        </div>


        <div style="display:flex;gap:8px;">

          <button
            type="button"
            class="add-member-button"
            onclick="showAddMember()"
          >
            ＋新增
          </button>

          <button
            type="button"
            class="manage-member-button"
            onclick="toggleMemberManager()"
          >
            <span class="manage-member-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="8" r="3"></circle>
                <path d="M3.5 20c.6-3.1 2.4-5 5.5-5s4.9 1.9 5.5 5"></path>
                <path d="M16 11a3 3 0 1 0 0-6"></path>
                <path d="M17 15c2.1.4 3.4 2 4 5"></path>
              </svg>
            </span>
            管理
          </button>

        </div>

      </div>


      <select
        id="student-select"
        onchange="onStudentChange()"
      ></select>
      
    </div>


    <!-- ==========================================================
         管理成員面板 (已修復缺少容器的問題)
         ========================================================== -->

    <div
      id="member-manager-box"
      class="member-manager-box hidden"
    >
      <div class="member-manager-title">
        <span class="member-manager-title-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="8" r="3"></circle>
            <path d="M3.5 20c.6-3.1 2.4-5 5.5-5s4.9 1.9 5.5 5"></path>
            <path d="M16 11a3 3 0 1 0 0-6"></path>
            <path d="M17 15c2.1.4 3.4 2 4 5"></path>
          </svg>
        </span>
        成員管理
      </div>
      <div id="member-manager-list">
        <!-- 這裡會由 JS 動態填入成員列表 -->
      </div>
    </div>


    <!-- ==========================================================
         新增成員
         ========================================================== -->

    <div
      id="add-member-box"
      class="add-member-box hidden"
    >

      <div class="add-member-title">
        ＋ 新增成員
      </div>


      <div class="form-group">

        <label>
          學員姓名
        </label>

        <input
          type="text"
          id="add-student"
          maxlength="50"
          placeholder="例如：王小明"
        >

      </div>


      <div class="form-group">

        <label>
          您與學員的關係
        </label>

        <select
          id="add-relation"
          onchange="handleAddRelationChange()"
        >

          <option value="爸爸">
            爸爸
          </option>

          <option value="媽媽">
            媽媽
          </option>

          <option value="阿公">
            阿公
          </option>

          <option value="阿嬤">
            阿嬤
          </option>

          <option value="其他">
            其他（自行填寫）
          </option>

        </select>

      </div>


      <div
        class="form-group hidden"
        id="add-other-relation-group"
      >

        <label>
          請填寫您與學員的關係
        </label>

        <input
          type="text"
          id="add-other-relation"
          maxlength="20"
          placeholder="例如：阿姨、叔叔、監護人"
        >

      </div>


      <div class="add-member-actions">

        <button
          type="button"
          class="cancel-button"
          onclick="cancelAddMember()"
        >
          取消
        </button>

        <button
          type="button"
          id="add-member-confirm-button"
          class="confirm-add-button"
          onclick="handleAddMember()"
        >
          確認新增
        </button>

      </div>

    </div>


    <!-- ==========================================================
         請假
         ========================================================== -->

    <div id="leave-form-pane">

      <div class="form-group">

        <label>
          請假日期
        </label>

        <input
          type="date"
          id="leave-date"
        >

      </div>


      <div class="form-group">

        <label>
          請假原因 / 備註
        </label>

        <textarea
          id="leave-remark"
          rows="2"
          maxlength="500"
          placeholder="若有特殊狀況請在此說明"
        ></textarea>

      </div>


      <button
        id="submit-leave-button"
        onclick="submitLeave()"
      >
        送出請假申請
      </button>

    </div>


    <!-- ==========================================================
         補課
         ========================================================== -->

    <div
      id="makeup-form-pane"
      class="hidden"
    >

      <div class="form-group">

        <label>
          📌 選擇要抵扣的原請假日期（對應缺課）
        </label>

        <select
          id="makeup-original-date"
        >

          <option value="">
            -- 請先選擇請假紀錄 --
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>
          預約補課日期
        </label>

        <input
          type="date"
          id="makeup-date"
        >

      </div>     


      <button
        id="submit-makeup-button"
        onclick="submitMakeup()"
        style="background:#0ea5e9"
      >
        送出補課預約
      </button>

    </div>


    <!-- ==========================================================
         歷史
         ========================================================== -->

    <div style="margin-top:24px">

      <hr>

      <h3
        id="history-title"
        style="
          font-size:15px;
          color:#334155;
          margin-bottom:10px
        "
      >
        📋 近期請假紀錄
      </h3>

      <div id="history-list">
        尚無紀錄
      </div>

    </div>

  </div>

</div>


<script>

// ================================================================
// 基本設定
// ================================================================

const LIFF_ID =
  "2011307172-d3esgseq";


const GAS_API_URL =
  "https://script.google.com/macros/s/AKfycbz8TdFPRaKbB3HMhXDODVd5rATBFUOJsBhaJZTeIye7u-Qk92s87LAg2ndog7b_QjgW/exec";


const GAS_API_CHANNEL =
  "NEWWU_SOCCER_GAS_API";


const RELOGIN_KEY =
  "newwu_liff_relogin_attempt_v2";


let lineIdToken = "";

let userLineId = "";

let userBindings = [];

let currentTab = "leave";

let liffInitialized = false;

let reloginInProgress = false;


const pendingApiRequests =
  new Map();


// ================================================================
// 送出狀態
// ================================================================

const submittingState = {

  bind: false,

  addMember: false,

  leave: false,

  makeup: false

};


// ================================================================
// GAS iframe postMessage
// ================================================================

window.addEventListener(
  "message",
  function(event) {

    const message =
      event &&
      event.data;


    if (
      !message ||
      message.channel !==
        GAS_API_CHANNEL
    ) {

      return;
    }


    const requestId =
      message.requestId;


    if (!requestId) {

      return;
    }


    const pending =
      pendingApiRequests.get(
        requestId
      );


    if (!pending) {

      return;
    }


    pendingApiRequests.delete(
      requestId
    );


    clearTimeout(
      pending.timer
    );


    if (
      pending.iframe &&
      pending.iframe.parentNode
    ) {

      pending.iframe.parentNode.removeChild(
        pending.iframe
      );
    }


    if (
      message.response &&
      message.response.ok
    ) {

      pending.resolve(
        message.response.data
      );

    } else {

      pending.reject(
        new Error(
          message.response &&
          message.response.error
            ? message.response.error
            : "GAS API 發生未知錯誤。"
        )
      );
    }

  }
);


// ================================================================
// 呼叫 GAS
// ================================================================

function sendGasApiRequest(action, payload) {
  return new Promise(function(resolve, reject) {
    const bodyData = Object.assign(
      {},
      payload || {},
      { action: action }
    );

    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify(bodyData)
    })
    .then(function(response) {
      return response.text();
    })
    .then(function(text) {
      try {
        const json = JSON.parse(text);
        if (json.ok) {
          resolve(json.data);
        } else {
          reject(new Error(json.error || "GAS 執行發生錯誤。"));
        }
      } catch (e) {
        reject(new Error("伺服器回傳格式不正確：" + text));
      }
    })
    .catch(function(error) {
      reject(new Error("網路連線失敗或伺服器逾時：" + (error.message || error)));
    });
  });
}


// ================================================================
// 判斷 Token 過期
// ================================================================

function isExpiredTokenError(
  err
) {

  const message =
    String(
      err &&
      err.message
        ? err.message
        : err || ""
    ).toLowerCase();


  return (

    message.includes(
      "idtoken expired"
    ) ||

    message.includes(
      "id token expired"
    ) ||

    message.includes(
      "token expired"
    ) ||

    message.includes(
      "invalid id token"
    ) ||

    message.includes(
      "invalid_id_token"
    ) ||

    message.includes(
      "line token 已過期"
    ) ||

    message.includes(
      "line 身分驗證失敗"
    )

  );
}


// ================================================================
// 初始化 LIFF
// ================================================================

async function ensureLiffInitialized() {

  if (
    typeof liff === "undefined"
  ) {

    throw new Error(
      "LIFF SDK 尚未載入。"
    );
  }


  if (
    !liffInitialized
  ) {

    await liff.init({

      liffId:
        LIFF_ID,

      withLoginOnExternalBrowser:
        true

    });


    liffInitialized =
      true;
  }
}


// ================================================================
// LIFF redirect URI
// ================================================================

function getReloginRedirectUri() {

  const params =
    new URLSearchParams(
      location.search
    );


  const state =
    params.get(
      "liff.state"
    );


  if (state) {

    try {

      return new URL(
        "." + state,
        location.href
      ).toString();

    } catch (e) {

      console.warn(
        "無法解析 liff.state：",
        e
      );
    }
  }


  return location.href
    .split("#")[0];
}


// ================================================================
// 強制 LINE 重新登入
// ================================================================

async function forceLineLogin(
  reason
) {

  if (
    reloginInProgress
  ) {

    return;
  }


  reloginInProgress =
    true;


  sessionStorage.setItem(
    RELOGIN_KEY,
    "1"
  );


  const loading =
    document.getElementById(
      "loading"
    );


  loading.classList.remove(
    "hidden"
  );


  loading.innerHTML =
    "<div>" +
    "LINE 登入資訊已過期。<br>" +
    "正在清除舊登入狀態並重新登入...<br>" +
    "<small>若沒有自動跳轉，請按重新登入。</small>" +
    "</div>" +
    "<button class='login-button' " +
    "onclick='manualLineLogin()'>" +
    "重新登入 LINE" +
    "</button>";


  try {

      liff.isLoggedIn() &&
      !liff.isInClient()
    ) {

    }

  } catch (error) {

    console.warn(

      error
    );
  }


  setTimeout(
    function() {

      manualLineLogin();

    },
    500
  );
}


// ================================================================
// 手動 LINE 登入
// ================================================================

function manualLineLogin() {

  try {

    sessionStorage.setItem(
      RELOGIN_KEY,
      "1"
    );


    const uri =
      getReloginRedirectUri();


    if (
      !liff.isInClient()
    ) {

      liff.login({
        redirectUri:
          uri
      });

    } else {

      location.reload();
    }

  } catch (error) {

    showError(
      "LINE 登入失敗",
      error.message ||
        error
    );
  }
}


// ================================================================
// 取得最新 LINE ID Token
// ================================================================

async function getCurrentLineIdToken() {

  await ensureLiffInitialized();


  if (
    !liff.isLoggedIn()
  ) {

    if (
      !liff.isInClient()
    ) {

      liff.login({

        redirectUri:
          getReloginRedirectUri()

      });


      throw new Error(
        "正在重新登入 LINE..."
      );
    }


    throw new Error(
      "LINE 登入狀態已失效，請重新開啟系統。"
    );
  }


  const token =
    liff.getIDToken();


  if (!token) {

    throw new Error(
      "無法取得 LINE ID Token，請重新登入 LINE。"
    );
  }


  lineIdToken =
    String(token);


  return lineIdToken;
}


// ================================================================
// API wrapper
// ================================================================

async function callGasApi(
  action,
  payload
) {

  const token =
    await getCurrentLineIdToken();


  const body =
    Object.assign(
      {},
      payload || {},
      {
        idToken:
          token
      }
    );


  try {

    return await sendGasApiRequest(
      action,
      body
    );

  } catch (error) {

    if (
      !isExpiredTokenError(
        error
      )
    ) {

      throw error;
    }


    console.warn(
      "LINE ID Token expired，重新登入。",
      error
    );


    await forceLineLogin(
      error
    );


    throw new Error(
      "IdToken expired，正在重新登入 LINE..."
    );
  }
}

// 頁面初始化
// ================================================================

window.addEventListener(
  "load",
  initSystem
);


async function initSystem() {

  const loading =
    document.getElementById(
      "loading"
    );


  try {

    await ensureLiffInitialized();


    if (
      !liff.isLoggedIn()
    ) {

      if (
        !liff.isInClient()
      ) {

        loading.innerHTML =
          "正在前往 LINE 登入...";


        liff.login({

          redirectUri:
            getReloginRedirectUri()

        });


        return;
      }


      throw new Error(
        "LINE 登入尚未完成，請重新開啟系統。"
      );
    }


    loading.innerHTML =
      "正在取得 LINE 身分驗證資訊...";


    lineIdToken =
      await getCurrentLineIdToken();


    loading.innerHTML =
      "正在驗證 LINE 身分...";


    const verifiedUser =
      await callGasApi(
        "verifyLineIdToken",
        {}
      );


    if (
      !verifiedUser ||
      !verifiedUser.userId
    ) {

      throw new Error(
        "伺服器沒有回傳有效的 LINE User ID。"
      );
    }


    userLineId =
      String(
        verifiedUser.userId
      ).trim();


    sessionStorage.removeItem(
      RELOGIN_KEY
    );


    loading.innerHTML =
      "正在確認您的會員資料...";


    const bindings =
      await callGasApi(
        "checkLineId",
        {}
      );


    onCheckBindResult(
      bindings
    );


  } catch (error) {

    console.error(
      "LIFF/API ERROR",
      error
    );


    if (
      isExpiredTokenError(
        error
      )
    ) {

      await forceLineLogin(
        error
      );

      return;
    }


    showError(
      "LINE 身分確認失敗",
      error.message ||
        error
    );
  }
}

// ================================================================
// HTML escape
// ================================================================

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


// ================================================================
// 今天
// ================================================================

function todayString() {

  const d =
    new Date();


  const y =
    d.getFullYear();


  const m =
    String(
      d.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    y +
    "-" +
    m +
    "-" +
    day
  );
}

// ================================================================
// 統一解析歷史資料
// ================================================================

function normalizeHistoryResult(
  result
) {

  if (
    Array.isArray(result)
  ) {

    return result;
  }


  if (
    result &&
    Array.isArray(
      result.history
    )
  ) {

    return result.history;
  }


  if (
    result &&
    Array.isArray(
      result.data
    )
  ) {

    return result.data;
  }


  return [];
}

          "刪除" +
          "</button>";
      } else if (canCancelMakeup) {
        const studentName = document.getElementById("student-select").value;
        
        actionButton =
          "<button " +
          "class='delete-leave-button' " +
          "onclick='cancelMakeup(" +
            JSON.stringify(item.rowNumber || "") + ", " +
            JSON.stringify(item.originalDate || "") + ", " +
            JSON.stringify(item.date || "") + ", " +
            JSON.stringify(studentName || "") +
          ")'>" +
          "取消預約" +
          "</button>";
      }

      html +=

        "<div class='history-card'>" +

        "<div class='history-row'>" +

        "<div class='history-content'>" +

        "<b>日期：" +

        escapeHtml(displayDate) +

        "</b> | 狀態：" +

        "<span style='color:#4f46e5'>" +

        escapeHtml(
          item.status ||
          ""
        ) +

        "</span>" +

        "<br>" +

        info +

        "</div>" +

        actionButton +

        "</div>" +

        "</div>";
    }
  );


  list.innerHTML =
    html;
}


// ================================================================
// 可補課請假日期
// ================================================================

async function loadValidLeaveDates() {

  const name =
    document
      .getElementById(
        "student-select"
      )
      .value;


  const select =
    document
      .getElementById(
        "makeup-original-date"
      );


  select.innerHTML =
    "<option value=''>" +
    "載入中..." +
    "</option>";


  if (!name) {

    select.innerHTML =
      "<option value=''>" +
      "-- 請先選擇成員 --" +
      "</option>";


    return;
  }


  try {

    const leaves =
      normalizeHistoryResult(
        await callGasApi(
          "getValidLeaveDates",
          {
            studentName:
              name
          }
        )
      );


    select.innerHTML =
      "";


    if (
      !leaves.length
    ) {

      select.innerHTML =
        "<option value=''>" +
        "⚠️ 該成員目前沒有可用的請假紀錄" +
        "</option>";


      return;
    }


    const firstOption =
      document.createElement(
        "option"
      );


    firstOption.value =
      "";


    firstOption.text =
      "-- 請選擇要補哪一天的缺 --";


    select.appendChild(
      firstOption
    );


    leaves.forEach(
      function(leave) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          leave.date;


        option.text =
          "📅 原請假日期：" +
          leave.date +
          "（原因：" +
          (
            leave.reason ||
            "無"
          ) +
          "）";

        option.dataset.rowNumber = leave.rowNumber !== undefined ? leave.rowNumber : '';


        select.appendChild(
          option
        );
      }
    );


  } catch (error) {

    onServerFail(
      error
    );
  }
}


// ================================================================
// 送出請假
// ================================================================

async function submitLeave() {

  if (
    submittingState.leave
  ) {

    return;
  }


  const name =
    document
      .getElementById(
        "student-select"
      )
      .value;


  const date =
    document
      .getElementById(
        "leave-date"
      )
      .value;


  const remark =
    document
      .getElementById(
        "leave-remark"
      )
      .value;


  if (!name) {

    alert(
      "請先選擇成員！"
    );

    return;
  }


  if (!date) {

    alert(
      "請選擇請假日期！"
    );

    return;
  }


  const binding =
    userBindings.find(
      function(item) {

        return (
          item.studentName ===
          name
        );
      }
    );


  submittingState.leave =
    true;


  const button =
    document.getElementById(
      "submit-leave-button"
    );


  button.disabled =
    true;

  button.textContent =
    "送出中...";


  try {

    await callGasApi(
      "saveLeaveRecord",
      {

        relation:
          binding
            ? binding.relation
            : "家長",

        studentName:
          name,

        date:
          date,

        remark:
          remark

      }
    );


    alert(
      "請假申請已送出！"
    );


    document
      .getElementById(
        "leave-date"
      )
      .value =
      todayString();


    document
      .getElementById(
        "leave-remark"
      )
      .value =
      "";


    await loadHistory();


  } catch (error) {

    if (
      isExpiredTokenError(
        error
      )
    ) {

      await forceLineLogin(
        error
      );

      return;
    }


    alert(
      "送出失敗：" +
      (
        error.message ||
        error
      )
    );

  } finally {

    submittingState.leave =
      false;

    button.disabled =
      false;

    button.textContent =
      "送出請假申請";
  }
}


// ================================================================
// 送出補課
// ================================================================

async function submitMakeup() {

  if (
    submittingState.makeup
  ) {

    return;
  }


  const name =
    document
      .getElementById(
        "student-select"
      )
      .value;


  const originalDateSelect =
    document
      .getElementById(
        "makeup-original-date"
      );

  const originalDate = originalDateSelect.value;


  const date =
    document
      .getElementById(
        "makeup-date"
      )
      .value;


  if (!name) {

    alert(
      "請先選擇成員！"
    );

    return;
  }


  if (!originalDate) {

    alert(
      "請選擇您要抵扣的原請假日期！"
    );

    return;
  }


  if (!date) {

    alert(
      "請選擇預約補課日期！"
    );

    return;
  }


  let rowNumber = '';
  if (originalDateSelect.selectedOptions.length > 0) {
    rowNumber = originalDateSelect.selectedOptions[0].dataset.rowNumber || '';
  }


  const binding =
    userBindings.find(
      function(item) {

        return (
          item.studentName ===
          name
        );
      }
    );


  submittingState.makeup =
    true;


  const button =
    document.getElementById(
      "submit-makeup-button"
    );


  button.disabled =
    true;

  button.textContent =
    "送出中...";


  try {

    await callGasApi(
      "saveMakeupRecord",
      {

        relation:
          binding
            ? binding.relation
            : "家長",

        studentName:
          name,

        originalDate:
          originalDate,

        date:
          date,

        rowNumber:
          rowNumber

      }
    );


    alert(
      "補課預約已送出！"
    );


    document
      .getElementById(
        "makeup-date"
      )
      .value =
      todayString();


    await loadValidLeaveDates();

    await loadHistory();


  } catch (error) {

    if (
      isExpiredTokenError(
        error
      )
    ) {

      await forceLineLogin(
        error
      );

      return;
    }


    alert(
      "送出失敗：" +
      (
        error.message ||
        error
      )
    );

  } finally {

    submittingState.makeup =
      false;

    button.disabled =
      false;

    button.textContent =
      "送出補課預約";
  }
}


// ================================================================
// 刪除請假
// ================================================================

async function deleteLeave(
  date
) {

  const name =
    document
      .getElementById(
        "student-select"
      )
      .value;


  if (
    !name ||
    !date
  ) {

    return;
  }


  if (
    !confirm(
      "確定要刪除 " +
      date +
      " 的請假紀錄嗎？\n\n" +
      "刪除後將無法復原。"
    )
  ) {

    return;
  }


  try {

    await callGasApi(
      "deleteLeaveRecord",
      {

        studentName:
          name,

        date:
          date

      }
    );


    alert(
      "請假紀錄已刪除。"
    );


    await loadHistory();


    if (
      currentTab ===
      "makeup"
    ) {

      await loadValidLeaveDates();
    }


  } catch (error) {

    if (
      isExpiredTokenError(
        error
      )
    ) {

      await forceLineLogin(
        error
      );

      return;
    }


    alert(
      "刪除失敗：" +
      (
        error.message ||
        error
      )
    );
  }
}


// ================================================================
// 取消預約補課
// ================================================================

async function cancelMakeup(rowNumber, originalDate, makeupDate, studentName) {
  if (!confirm("確定要取消這筆預約補課嗎？\n取消後原請假紀錄將恢復為「已請假」狀態。")) {
    return;
  }

  try {
    await callGasApi(
      "cancelMakeupRecord",
      {
        studentName: studentName,
        rowNumber: rowNumber,
        originalDate: originalDate,
        date: makeupDate
      }
    );

    alert("已成功取消預約補課！");

    await loadHistory();
    await loadValidLeaveDates();

  } catch (error) {
    if (isExpiredTokenError(error)) {
      await forceLineLogin(error);
      return;
    }

    alert("取消失敗：" + (error.message || error));
  }
}


// ================================================================
// 綁定結果
// ================================================================

function onCheckBindResult(
  result
) {

  userBindings =
    Array.isArray(result)
      ? result
      : [];


  document
    .getElementById(
      "loading"
    )
    .classList.add(
      "hidden"
    );


  if (
    !userBindings.length
  ) {

    document
      .getElementById(
        "bind-section"
      )
      .classList.remove(
        "hidden"
      );


  } else {

    showMainSection();
  }
}

function toggleMemberManager() {

  const box =
    document.getElementById(
      "member-manager-box"
    );

  box.classList.toggle(
    "hidden"
  );

  if (
    !box.classList.contains(
      "hidden"
    )
  ) {
    renderMemberManager();
  }
}

function renderMemberManager() {

  const container =
    document.getElementById(
      "member-manager-list"
    );

  if (!userBindings.length) {

    container.innerHTML =
      "沒有任何成員";

    return;
  }

  let html = "";

  userBindings.forEach(function(member) {

    html +=
      `
      <div class="member-manager-item">

        <div class="member-info">
          <span class="member-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="3.2"></circle>
              <path d="M5.5 20c.7-3.7 2.9-5.7 6.5-5.7s5.8 2 6.5 5.7"></path>
            </svg>
          </span>
          <span>
            ${escapeHtml(member.studentName)}
            （${escapeHtml(member.relation)}）
          </span>
        </div>

        <button
          type="button"
          class="member-delete-button"
          aria-label="刪除 ${escapeHtml(member.studentName)}"
          title="刪除成員"
          onclick="deleteMember('${encodeURIComponent(member.studentName)}')"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h16"></path>
            <path d="M9 7V4h6v3"></path>
            <path d="M7 7l1 13h8l1-13"></path>
            <path d="M10 11v5"></path>
            <path d="M14 11v5"></path>
          </svg>
        </button>

      </div>
      `;
  });

  container.innerHTML = html;
}

</script>
